apiVersion: apps/v1
kind: Deployment
metadata:
  name: donn-larso-valer
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: donn-larso-valer
  template:
    metadata:
      labels:
        app: donn-larso-valer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: donn-larso-valer
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - luna
      containers:
      - name: app
        image: ghcr.io/kim1t/donn-larso-valer:latest@sha256:0bdaf83fcb40bd45913cc215ba32aeab4ee4d7a254fe9e4a23681703e40ec9b0 # {"$imagepolicy": "flux-system:donn-larso-valer"}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: APP_URL
          value: https://donn-lar-so-valer.brunobernard.dev
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              name: donn-larso-valer
              key: APP_KEY
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        startupProbe:
          httpGet:
            path: /up
            port: http
          periodSeconds: 1
          failureThreshold: 180
        readinessProbe:
          httpGet:
            path: /up
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /up
            port: http
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
