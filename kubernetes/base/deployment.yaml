apiVersion: apps/v1
kind: Deployment
metadata:
  name: donn-larso-valer
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: donn-larso-valer
  template:
    metadata:
      labels:
        app: donn-larso-valer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app: donn-larso-valer
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - luna
      containers:
      - name: app
        image: ghcr.io/kim1t/donn-larso-valer:latest@sha256:5c8b9f075a128ada6e133df93d9ba57ac66b6b59d533022af8f5f9b4ffdab3dd # {"$imagepolicy": "flux-system:donn-larso-valer"}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: APP_URL
          value: https://donn-lar-so-valer.brunobernard.dev
        - name: APP_KEY
          valueFrom:
            secretKeyRef:
              name: donn-larso-valer
              key: APP_KEY
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        startupProbe:
          httpGet:
            path: /up
            port: http
          periodSeconds: 1
          failureThreshold: 180
        readinessProbe:
          httpGet:
            path: /up
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /up
            port: http
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: storage
          mountPath: /var/www/html/storage/app/public
        - name: tmp
          mountPath: /tmp
        - name: framework
          mountPath: /var/www/html/storage/framework
        - name: logs
          mountPath: /var/www/html/storage/logs
        - name: bootstrap-cache
          mountPath: /var/www/html/bootstrap/cache
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
      - name: storage
        persistentVolumeClaim:
          claimName: storage
      - name: tmp
        emptyDir: {}
      - name: framework
        emptyDir: {}
      - name: logs
        emptyDir: {}
      - name: bootstrap-cache
        emptyDir: {}
