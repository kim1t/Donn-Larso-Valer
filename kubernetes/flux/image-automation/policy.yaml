apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: donn-larso-valer
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: donn-larso-valer
  filterTags:
    pattern: ^latest$
  policy:
    alphabetical:
      order: asc
  digestReflectionPolicy: Always
  interval: 5m
