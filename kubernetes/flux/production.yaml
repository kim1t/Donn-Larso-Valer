apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: donn-larso-valer-production
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  path: ./kubernetes/overlays/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: donn-larso-valer
  decryption:
    provider: sops
    secretRef:
      name: sops-age
