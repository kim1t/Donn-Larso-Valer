apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- secret.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
- certificate.yaml
- ingressroute.yaml
- image-automation/repository.yaml
- image-automation/policy.yaml
- image-automation/update.yaml
patches:
- path: prune-protection.yaml
  target:
    kind: (Namespace|PersistentVolumeClaim)
