apiVersion: apps/v1
kind: Deployment
metadata:
  name: donn-larso-valer
spec:
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    spec:
      affinity: null
      nodeSelector:
        kubernetes.io/hostname: luna
      containers:
      - name: app
        image: PREVIEW_IMAGE
        env:
        - name: APP_ENV
          value: preview
        - name: APP_URL
          value: https://donn-lar-so-valer-pr-PR_NUMBER.brunobernard.dev
        - name: APP_KEY
          $patch: delete
      volumes:
      - name: data
        persistentVolumeClaim: null
        emptyDir: {}
