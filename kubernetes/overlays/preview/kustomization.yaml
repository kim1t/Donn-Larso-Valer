apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: donn-larso-valer-pr-PR_NUMBER
resources:
- namespace.yaml
- middleware.yaml
- ../../base
patches:
- path: deployment.yaml
- path: certificate.yaml
- path: ingressroute.yaml
- target:
    kind: IngressRoute
    name: donn-larso-valer
  patch: |-
    - op: replace
      path: /spec/tls
      value:
        store:
          name: default
          namespace: traefik-system
