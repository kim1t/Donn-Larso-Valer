apiVersion: v1
kind: Namespace
metadata:
  name: donn-larso-valer-pr-6
---
apiVersion: v1
kind: Service
metadata:
  name: donn-larso-valer
  namespace: donn-larso-valer-pr-6
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: donn-larso-valer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: donn-larso-valer
  namespace: donn-larso-valer-pr-6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: donn-larso-valer
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: donn-larso-valer
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: APP_ENV
          value: preview
        - name: APP_URL
          value: https://donn-lar-so-valer-pr-6.brunobernard.dev
        image: ghcr.io/kim1t/donn-larso-valer:pr-6-e7696c07435ffd5f8443c0778632e77bbcdeee87
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /up
            port: http
          periodSeconds: 20
        name: app
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /up
            port: http
          periodSeconds: 10
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          failureThreshold: 36
          httpGet:
            path: /up
            port: http
          periodSeconds: 5
        volumeMounts:
        - mountPath: /data
          name: data
      nodeSelector:
        kubernetes.io/hostname: luna
      securityContext:
        fsGroup: 82
        runAsGroup: 82
        runAsNonRoot: true
        runAsUser: 82
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: data
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: donn-larso-valer-tls
  namespace: donn-larso-valer-pr-6
spec:
  dnsNames:
  - donn-lar-so-valer-pr-6.brunobernard.dev
  issuerRef:
    kind: ClusterIssuer
    name: cluster-issuer-cloudflare-dns01
  secretName: donn-larso-valer-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: donn-larso-valer
  namespace: donn-larso-valer-pr-6
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`donn-lar-so-valer-pr-6.brunobernard.dev`)
    services:
    - name: donn-larso-valer
      port: 80
  tls:
    secretName: donn-larso-valer-tls
